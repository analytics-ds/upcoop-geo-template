let HASVOL=false;
async function loadJSON(u){ try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
(async()=>{
const vols=await loadJSON('volumes.json')||{};   // { "mot-clé": volume Google mensuel }

HASVOL=Object.keys(vols).length>0;
const children=FAMS.map(f=>{ const kids=RAW.filter(p=>p.fam===f).map(p=>{ const g=vols[p.kw]; const r=runs[p.id]||{}; return {name:p.name,kw:p.kw,g:g==null?null:g,vol:g==null?0:Math.round(g*0.12),gpt:r.gpt,aio:r.aio}; }); kids.sort((a,b)=>b.vol-a.vol); return {name:f,vol:kids.reduce((s,k)=>s+k.vol,0),children:kids}; });

function fmt0(n){return n.toLocaleString('fr-FR').replace(/\u202f/g,' ');}
function render(data){
const fmt=n=>n.toLocaleString('fr-FR').replace(/\u202f/g,' ');
const root=d3.hierarchy(data); root.x0=0; root.y0=0;
const lvl=+(new URLSearchParams(location.search).get('level')||99);
root.each(d=>{ if(d.depth>=lvl && d.children){ d._children=d.children; d.children=null; } });
const macro=location.search.includes('macro');
const dx=macro?30:72, dy=macro?300:340; const tree=d3.tree().nodeSize([dx,dy]);
const svg=d3.select('#wrap').append('svg'); const g=svg.append('g');
function update(source){
  tree(root); let x0=Infinity,x1=-Infinity; root.each(d=>{ if(d.x<x0)x0=d.x; if(d.x>x1)x1=d.x; });
  const h=x1-x0+dx*2, w=dy*3+520; svg.attr('width',w).attr('height',h); g.attr('transform',`translate(60,${dx-x0})`);
  const link=g.selectAll('path.link').data(root.links(),d=>d.target.data.name);
  link.join('path').attr('class','link').attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
  const node=g.selectAll('g.node').data(root.descendants(),d=>d.data.name);
  const ne=node.join(enter=>{ const n=enter.append('g'); n.append('rect').attr('rx',8).attr('ry',8); n.append('text').attr('class','label').attr('dy','-0.55em'); n.append('text').attr('class','vol').attr('dy','0.32em'); n.append('text').attr('class','pill').attr('dy','0.32em'); return n; });
  ne.attr('class',d=>'node depth'+d.depth+(d.depth===0?' root':d.depth===1?' fam':' leaf'+(d.data.gpt&&d.data.gpt.startsWith('Upcoop absent')?' absent':d.data.gpt==='Upcoop 1er'?' first':'')))
    .attr('transform',d=>`translate(${d.y},${d.x})`)
    .on('click',(e,d)=>{ if(d.children){ d._children=d.children; d.children=null; } else if(d._children){ d.children=d._children; d._children=null; } update(d); });
  ne.select('text.label').attr('x',10).text(d=>{const n=d.data.name; const lim=macro?46:52; const t=(d.depth===2&&n.length>lim)?n.slice(0,lim-2)+'…':n; return macro&&d.depth<2? t+(HASVOL?' · '+fmt(d.data.vol):'') : t;});
  if(macro){ ne.select('text.vol').text(''); ne.select('text.pill').text(''); ne.select('text.label').attr('dy','0.32em'); }
  ne.select('text.vol').attr('x',10).attr('dy',d=>d.depth===2?'0.75em':'0.75em').text(d=>d.depth===2? (d.data.g!=null?`${fmt(d.data.vol)} prompts / mois · « ${d.data.kw} » ${fmt(d.data.g)}`:`« ${d.data.kw} » · volume à venir`) : (HASVOL?`${fmt(d.data.vol)} prompts / mois`+(d.depth===0?' · '+d.data.kw:''):(d.depth===0?d.data.kw:d.children||d._children?(d.children||d._children).length+' prompts':'')));
  ne.select('text.pill').attr('x',10).attr('dy','2.05em').text(d=>d.depth===2?(d.data.gpt||d.data.aio)?`ChatGPT : ${d.data.gpt||'à venir'} · aperçu IA : ${d.data.aio||'à venir'}`:'':'');
  ne.each(function(d){ const t=this.querySelectorAll('text'); let w=0; t.forEach(x=>{ w=Math.max(w,x.getComputedTextLength()); }); const hh=macro?(d.depth===2?24:30):(d.depth===2?66:48); d3.select(this).select('rect').attr('x',0).attr('y',-hh/2).attr('width',w+20).attr('height',hh); });
  if(macro){ ne.select('text.vol').text(''); ne.select('text.pill').text(''); ne.select('text.label').attr('dy','0.32em'); }
  ne.select('text.vol').attr('fill',d=>d.depth<2?'#bdbdbd':'#5c5c5c'); ne.select('text.pill').attr('fill',d=>(d.data.gpt||'').startsWith('Upcoop absent')?'#d64036':'#5c5c5c');
}
if(macro) document.body.classList.add('macro');
update(root);
if(location.search.includes('bare')){ document.getElementById('top').style.display='none'; document.getElementById('wrap').style.top='0'; }
const zm=new URLSearchParams(location.search).get('zoom'); if(zm){ const s=document.querySelector('svg'); s.style.transform=`scale(${zm})`; s.style.transformOrigin='0 0'; const wrap=document.getElementById('wrap'); wrap.scrollTop=Math.max(0,(+s.getAttribute('height')*zm-(document.getElementById('wrap').clientHeight))/2); }
if(location.search.includes('fit')){ const s=document.querySelector('svg'); const H=window.innerHeight-52, W=window.innerWidth; const k=Math.min(H/+s.getAttribute('height'), W/+s.getAttribute('width')); s.style.transform=`scale(${k})`; s.style.transformOrigin='0 0'; document.getElementById('wrap').style.overflow='hidden'; }
}
